<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} · {{.Domain}}</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            background: #f4f1ea;
            color: #1c1915;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #161410; color: #f3efe6; }
            .card, .user { background: #221f1a; }
            .muted, .domain { color: #b7ad9e; }
            .label { border-color: #3a342c; }
            .deny { background: #2c2822; color: #f3efe6; }
        }
        .card {
            width: min(440px, 100%);
            background: #fffdf8;
            border-radius: 18px;
            padding: 28px 24px 22px;
            box-shadow: 0 16px 50px rgba(40, 30, 10, 0.12);
        }
        .domain { font-size: 13px; color: #6d6458; letter-spacing: 0.02em; }
        h1 { font-size: 22px; line-height: 1.3; margin: 8px 0 4px; }
        .app { font-size: 15px; margin: 0 0 18px; }
        .app strong { font-weight: 650; }
        .user {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            background: #f6f1e7;
            margin-bottom: 16px;
        }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            display: grid; place-items: center;
            background: #2f5d50; color: #fff; font-weight: 650;
        }
        .name { font-weight: 650; }
        .muted { color: #6d6458; font-size: 13px; }
        ul { list-style: none; padding: 0; margin: 0 0 18px; }
        .label {
            padding: 10px 0;
            border-bottom: 1px solid #ece4d6;
            font-size: 14px;
        }
        .actions { display: flex; gap: 10px; }
        button {
            flex: 1;
            border: 0;
            border-radius: 999px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 650;
            cursor: pointer;
        }
        .allow { background: #2f5d50; color: #fff; }
        .deny { background: #ece7de; color: #1c1915; }
        a { color: #2f5d50; }
        .icon { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="domain">{{.Domain}}</div>
        <h1>{{.Title}}</h1>
        <p class="app">
            {{if .Icon}}<img class="icon" src="{{.Icon}}" alt="">{{end}}
            <strong>{{.AppName}}</strong> 想访问你的账户
        </p>
        {{if .Website}}<p class="muted"><a href="{{.Website}}">{{.Website}}</a></p>{{end}}
        <div class="user">
            <div class="avatar">{{.Initial}}</div>
            <div>
                <div class="name">{{.DisplayName}}</div>
                <div class="muted">@{{.Username}}</div>
            </div>
        </div>
        <ul>
            {{range .Labels}}<li class="label">{{.}}</li>{{end}}
        </ul>
        <form method="post" action="{{.Action}}">
            {{range .Hidden}}<input type="hidden" name="{{index . 0}}" value="{{index . 1}}">{{end}}
            <div class="actions">
                <button class="deny" type="submit" name="deny" value="1">拒绝</button>
                <button class="allow" type="submit">允许</button>
            </div>
        </form>
    </main>
</body>
</html>
