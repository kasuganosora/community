services:
  community:
    build: .
    container_name: community
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # The app stores uploads under ./uploads relative to its working
      # directory (/app).
      - ./uploads:/app/uploads
      - transfer-data:/app/.data-transfers
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Everything in .env is passed to the container; the app reads its
    # configuration from environment variables (they override any .env file).
    env_file:
      - .env
    # Container-specific settings override the values from .env.
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-community}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_0_HOST: redis
      REDIS_0_PORT: "6379"
      REDIS_0_PASSWORD: ""
      REDIS_0_DB: "0"
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set in .env, e.g. https://social.example.org}
      ENCRYPTED_KEY: ${ENCRYPTED_KEY:?ENCRYPTED_KEY must be set in .env (at least 16 characters)}
      DATA_TRANSFER_DIR: /app/.data-transfers
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-auto}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
    networks:
      - community-net

  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    container_name: community-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-community}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - community-net

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - community-net

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: community-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      # An empty MEILI_MASTER_KEY makes Meilisearch refuse to start. Only pass
      # it when MEILISEARCH_API_KEY is set; development mode otherwise accepts
      # unauthenticated requests, which matches the app's empty key.
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$MEILISEARCH_API_KEY" ]; then
          exec /bin/meilisearch --master-key "$$MEILISEARCH_API_KEY"
        fi
        exec /bin/meilisearch
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - community-net

volumes:
  mysql-data:
  redis-data:
  transfer-data:
  meili-data:

networks:
  community-net:
    driver: bridge
