services:
  community:
    build:
      context: .
      args:
        # Frontend build id (/version.json) = <commit>-<build time>. Pass the
        # commit as COMMUNITY_BUILD_ID or COMMUNITY_BUILD_SHA (either works):
        # COMMUNITY_BUILD_ID=$(git rev-parse --short=12 HEAD) docker compose build
        COMMUNITY_BUILD_SHA: ${COMMUNITY_BUILD_SHA:-}
        COMMUNITY_BUILD_ID: ${COMMUNITY_BUILD_ID:-}
    container_name: community
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # The app stores uploads under ./uploads relative to its working
      # directory (/app).
      - ./uploads:/app/uploads
      # Configuration written by the /setup wizard (ENV_FILE=/app/config/.env,
      # mode 0600) plus the .installed marker. Keep this directory: an empty
      # one on a new server opens the setup wizard. It lives under ./var
      # because ./config in the repository is Go source.
      - ./var/config:/app/config
      # SQLite databases and setup work files (Misskey exports, media copies).
      - ./data:/app/data
      - transfer-data:/app/.data-transfers
    depends_on:
      # The bundled database servers are optional (profiles "postgres" and
      # "mysql", usually selected with COMPOSE_PROFILES in .env). required:
      # false waits for whichever one is enabled and ignores the other; it
      # needs Docker Compose v2.20 or later.
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      # 自带引擎没起来时也不要挡住应用：搜索会退回数据库，外部地址同样如此。
      meilisearch:
        condition: service_healthy
        required: false
    # The app reads its own configuration from /app/config/.env (written by
    # the /setup wizard). A host .env next to this file is optional: when it
    # exists its variables are passed to the container as well and win over
    # /app/config/.env (they show as "locked by environment" in the admin
    # settings). Older deployments keep working with their host .env until it
    # is moved to ./var/config/.env (see docs/setup.md). required: false needs
    # Docker Compose v2.24 or later.
    env_file:
      - path: .env
        required: false
    # Database pool: DB_MAX_OPEN_CONNS (default 30 per process), DB_MAX_IDLE_CONNS
    # (10), DB_CONN_MAX_LIFETIME (30m), DB_CONN_MAX_IDLE_TIME (10m). Set them in
    # .env or the config file; on a PostgreSQL shared with Misskey keep the caps
    # of the server and any tootctl/community-transfer runs below max_connections
    # (docs/setup.md "Database connection pool").
    # Client addresses: forwarding headers are only trusted from TRUSTED_PROXIES
    # (default: loopback and private ranges, which covers the nginx hop on a
    # Docker bridge). nginx must set X-Real-IP $remote_addr; if the proxy is on
    # a public address, list it in TRUSTED_PROXIES.
    environment:
      # Defaults for the bundled services, used only when the configuration
      # does not name a host. Nothing here counts as "configured", so an
      # unconfigured container starts the setup wizard instead of failing.
      # - Bundled database: COMPOSE_PROFILES=postgres or =mysql; "db" is the
      #   network alias of that service.
      # - External database: enter its host in the wizard (or DB_HOST).
      COMMUNITY_DEFAULT_DB_HOST: db
      COMMUNITY_DEFAULT_REDIS_HOST: redis
      # Setup capability and credentials for the selected bundled database.
      # BUNDLED_DB_* avoids DB_* marking a fresh instance as configured.
      COMMUNITY_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      COMMUNITY_SETUP_DB_NAME: ${BUNDLED_DB_DATABASE:-${DB_DATABASE:-community}}
      COMMUNITY_SETUP_DB_USER: ${BUNDLED_DB_USERNAME:-${DB_USERNAME:-root}}
      COMMUNITY_SETUP_DB_PASSWORD: ${BUNDLED_DB_PASSWORD:-${DB_PASSWORD:-}}
      ENV_FILE: /app/config/.env
      SETUP_WORK_DIR: /app/data/setup-work
      DATA_TRANSFER_DIR: /app/.data-transfers
      # 外部 Meilisearch：在 .env 设置 MEILISEARCH_HOST 和 MEILISEARCH_API_KEY
      # （Master Key 或 Admin API Key，不要用只读的 Search API Key）。
      # 未设置 HOST 时连下面这个服务。不需要自带引擎时：
      # docker compose up -d --scale meilisearch=0
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-auto}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      MEILISEARCH_INDEX_PREFIX: ${MEILISEARCH_INDEX_PREFIX:-}
    networks:
      - community-net

  # Bundled MySQL server, started only with the "mysql" profile
  # (COMPOSE_PROFILES=mysql). Credentials follow DB_DATABASE / DB_USERNAME /
  # DB_PASSWORD from legacy host .env files; new wizard installs use
  # BUNDLED_DB_DATABASE / BUNDLED_DB_USERNAME / BUNDLED_DB_PASSWORD.
  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    container_name: community-mysql
    profiles: ["mysql"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${BUNDLED_DB_PASSWORD:-${DB_PASSWORD:-}}
      MYSQL_DATABASE: ${BUNDLED_DB_DATABASE:-${DB_DATABASE:-community}}
      COMMUNITY_DB_USERNAME: ${BUNDLED_DB_USERNAME:-${DB_USERNAME:-root}}
    # The image creates a non-root user only through MYSQL_USER, which must
    # not be "root"; set it (with the same password) when DB_USERNAME names
    # another user.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$COMMUNITY_DB_USERNAME" != "root" ]; then
          export MYSQL_USER="$$COMMUNITY_DB_USERNAME" MYSQL_PASSWORD="$$MYSQL_ROOT_PASSWORD"
        fi
        exec docker-entrypoint.sh mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # TCP, so the image's socket-only init server does not count as ready.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks:
      community-net:
        aliases: [db]

  # Bundled PostgreSQL server, started only with the "postgres" profile
  # (COMPOSE_PROFILES=postgres). Credentials follow DB_DATABASE /
  # DB_USERNAME / DB_PASSWORD from legacy host .env files; new wizard
  # installs use BUNDLED_DB_* and select Built-in in the wizard.
  postgres:
    image: postgres:17-alpine
    container_name: community-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${BUNDLED_DB_DATABASE:-${DB_DATABASE:-community}}
      POSTGRES_USER: ${BUNDLED_DB_USERNAME:-${DB_USERNAME:-root}}
      POSTGRES_PASSWORD: ${BUNDLED_DB_PASSWORD:-${DB_PASSWORD:-}}
    healthcheck:
      # TCP, so the image's socket-only init server does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      community-net:
        aliases: [db]

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - community-net

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: community-meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      # An empty MEILI_MASTER_KEY makes Meilisearch refuse to start. Only pass
      # it when MEILISEARCH_API_KEY is set; development mode otherwise accepts
      # unauthenticated requests, which matches the app's empty key.
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$MEILISEARCH_API_KEY" ]; then
          exec /bin/meilisearch --master-key "$$MEILISEARCH_API_KEY"
        fi
        exec /bin/meilisearch
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - community-net

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  transfer-data:
  meili-data:

networks:
  community-net:
    driver: bridge
