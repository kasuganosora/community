services:
  community:
    build: .
    container_name: community
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-community}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-community_secret}
      - REDIS_0_HOST=redis
      - REDIS_0_PORT=6379
      - REDIS_0_PASSWORD=
      - REDIS_0_DB=0
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
    networks:
      - community-net

  mysql:
    image: mysql:8.4
    container_name: community-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-community_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-community}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - community-net

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - community-net

volumes:
  mysql-data:
  redis-data:

networks:
  community-net:
    driver: bridge